name: ml-monitoring-dashboard

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Host 8210 → container 8000. Distinct from llm-guardrails-safety (8100)
      # and other local services so the stacks don't collide.
      - "8210:8000"
    environment:
      - ML_MONITOR_DB_URL=sqlite+aiosqlite:///./data/ml_monitor.db
      - ML_MONITOR_LOG_LEVEL=INFO
      - ML_MONITOR_DEMO_MODE=true
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9210:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3210:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  app_data:
  prometheus_data:
  grafana_data:
